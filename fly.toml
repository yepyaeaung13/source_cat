# Replace via fly launch --copy-config --name YOUR_UNIQUE_APP_NAME --no-deploy.
app = "sourcecat-change-me"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_SERVER = "true"
  PORT = "4000"
  DATABASE_PATH = "/data/sourcecat.sqlite"
  POOL_SIZE = "1"

[deploy]
  strategy = "rolling"

[[mounts]]
  source = "sourcecat_data"
  destination = "/data"
  initial_size = "1GB"
  snapshot_retention = 14
  scheduled_snapshots = true

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
